<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dshare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .peer-card {
            color: white;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-900 py-6">
    <div class="max-w-4xl mx-auto px-4">
        <header class="text-center mb-6">
            <h1 class="text-4xl font-bold text-white mb-2"><span class="text-orange-500">🚀</span> Dshare</h1>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <input type="text" id="device-name" placeholder="Enter device name" class="px-3 py-2 bg-gray-800 border border-gray-600 text-white placeholder-gray-400 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent">
                <span id="device-id" class="text-sm text-white"></span>
            </div>
        </header>

        <main class="space-y-6">
            <div class="bg-gray-800 rounded-lg shadow-sm border border-gray-700 p-6">
                <h2 class="text-xl font-semibold text-white mb-4">Available Devices</h2>
                <div id="peers-list" class="grid gap-3">
                    <div class="no-peers text-white text-center py-8">Searching for devices on your network...</div>
                </div>
            </div>

             <div id="messaging-section" class="bg-gray-800 rounded-lg shadow-sm border border-gray-700 p-6" style="display: none;">
                <h2 class="text-xl font-semibold text-white mb-4">Send a Message</h2>
                <div class="space-y-4">
                     <div id="messages-list" class="flex flex-col space-y-2 max-h-64 overflow-y-auto p-2"></div>
                    <div class="flex gap-2">
                        <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 px-3 py-2 bg-gray-700 border border-gray-600 text-white placeholder-gray-400 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent">
                        <button id="send-message-btn" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-md transition">Send</button>
                    </div>
                </div>
            </div>

            <div class="bg-gray-800 rounded-lg shadow-sm border border-gray-700 p-6">
                <input type="file" id="file-input" multiple hidden>
                <div id="drop-zone" class="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center hover:border-orange-400 transition cursor-pointer">
                    <p class="text-gray-400 mb-4">Drag & drop files here or</p>
                    <button id="select-files" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-md transition inline-flex items-center gap-2">
                        <span>📎</span> Select Files
                    </button>
                </div>
                <div id="selected-files" class="mt-4 space-y-2"></div>
                <div id="conversion-section" class="mt-4 p-4 bg-gray-700 rounded-md" style="display: none;">
                    <h3 class="text-lg font-medium text-white mb-2">Convert Documents</h3>
                    <p id="conversion-message" class="text-sm text-gray-400 mb-4" style="display: none;">Select a DOCX, ODT, or TXT file to enable conversions</p>
                    <div class="flex flex-wrap items-center gap-2">
                        <select id="convert-from-format" class="px-3 py-2 bg-gray-700 border border-gray-600 text-white rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500">
                            <option value="" class="bg-gray-700 text-white">Select source format</option>
                            <option value="docx" class="bg-gray-700 text-white">DOCX</option>
                            <option value="odt" class="bg-gray-700 text-white">ODT</option>
                            <option value="txt" class="bg-gray-700 text-white">TXT</option>
                        </select>
                        <span class="text-gray-400">→</span>
                        <select id="convert-to-format" class="px-3 py-2 bg-gray-700 border border-gray-600 text-white rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500">
                            <option value="" class="bg-gray-700 text-white">Select target format</option>
                            <option value="pdf" class="bg-gray-700 text-white">PDF</option>
                            <option value="docx" class="bg-gray-700 text-white">DOCX</option>
                            <option value="odt" class="bg-gray-700 text-white">ODT</option>
                            <option value="txt" class="bg-gray-700 text-white">TXT</option>
                        </select>
                        <button id="convert-btn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md transition">Convert</button>
                        <button id="send-original-btn" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md transition">Send Original</button>
                    </div>
                </div>
            </div>

            <div id="transfers-section" class="bg-gray-800 rounded-lg shadow-sm border border-gray-700 p-6" style="display: none;">
                <h2 class="text-xl font-semibold text-white mb-4">File Transfers</h2>
                <div id="transfers-list" class="space-y-3"></div>
            </div>
        </main>
    </div>

    <div id="notification" class="fixed bottom-4 right-4 bg-orange-600 text-white px-4 py-2 rounded-md shadow-lg z-50" style="display: none;"></div>
    <div id="connection-error" class="fixed top-4 right-4 bg-red-600 text-white px-4 py-2 rounded-md shadow-lg z-50" style="display: none;"></div>

    <div id="incoming-file-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center" style="display: none;">
        <div class="bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4 border border-gray-700">
            <h3 class="text-lg font-semibold text-white mb-4">Incoming File Transfer</h3>
            <p id="incoming-file-info" class="text-gray-300 mb-6"></p>
            <div class="flex justify-end gap-3">
                <button id="reject-transfer" class="px-4 py-2 text-gray-400 hover:text-white transition">Reject</button>
                <button id="accept-transfer" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-md transition">Accept</button>
            </div>
        </div>
    </div>

    <div id="connection-request-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center" style="display: none;">
        <div class="bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4 border border-gray-700">
            <h3 class="text-lg font-semibold text-white mb-4">Connection Request</h3>
            <p id="connection-request-info" class="text-gray-300 mb-6"></p>
            <div class="flex justify-end gap-3">
                <button id="reject-connection" class="px-4 py-2 text-gray-400 hover:text-white transition">Reject</button>
                <button id="accept-connection" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-md transition">Accept</button>
            </div>
        </div>
    </div>

    <template id="transfer-item-template">
        <div class="transfer-item bg-gray-800 border border-gray-700 rounded-lg p-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="file-icon text-lg"></span>
                    <div>
                        <strong class="file-name text-white"></strong>
                        <span class="file-size text-sm text-gray-400 ml-2"></span>
                    </div>
                </div>
                <div class="transfer-actions">
                    <button class="cancel-btn bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded-md text-sm transition">Cancel</button>
                </div>
            </div>
            <div class="transfer-status text-sm text-gray-400 mt-2"></div>
            <div class="transfer-progress mt-2 bg-gray-700 rounded-full h-2">
                <div class="transfer-progress-bar bg-orange-600 h-2 rounded-full transition-all"></div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
